<svg viewBox="0 0 1584 396" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="55%" stop-color="#12172A"/>
      <stop offset="100%" stop-color="#1A1030"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF6A3D"/>
      <stop offset="100%" stop-color="#FF3D68"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FF3D68" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FF6A3D" stop-opacity="0.55"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF3D68" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FF3D68" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- background -->
  <rect width="1584" height="396" fill="url(#bg)"/>
  <circle cx="1420" cy="80" r="220" fill="url(#glow)"/>

  <!-- dotted grid motif, top-left -->
  <g fill="#3A3F55">
    <circle cx="70" cy="46" r="3.2"/><circle cx="100" cy="46" r="3.2"/><circle cx="130" cy="46" r="3.2"/><circle cx="160" cy="46" r="3.2"/>
    <circle cx="70" cy="66" r="3.2"/><circle cx="100" cy="66" r="3.2"/><circle cx="130" cy="66" r="3.2"/><circle cx="160" cy="66" r="3.2"/>
    <circle cx="70" cy="86" r="3.2"/><circle cx="100" cy="86" r="3.2"/><circle cx="130" cy="86" r="3.2"/><circle cx="160" cy="86" r="3.2"/>
  </g>

  <!-- subtle bar-chart motif, right side -->
  <g opacity="0.9">
    <rect x="1330" y="230" width="26" height="90" rx="4" fill="url(#barGrad)"/>
    <rect x="1368" y="180" width="26" height="140" rx="4" fill="url(#barGrad)"/>
    <rect x="1406" y="130" width="26" height="190" rx="4" fill="url(#barGrad)"/>
    <rect x="1444" y="200" width="26" height="120" rx="4" fill="url(#barGrad)"/>
    <rect x="1482" y="150" width="26" height="170" rx="4" fill="url(#barGrad)"/>
    <polyline points="1330,235 1368,185 1406,135 1444,205 1482,155" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.55"/>
  </g>

  <!-- accent rule -->
  <rect x="70" y="150" width="6" height="120" rx="3" fill="url(#accent)"/>

  <!-- name -->
  <text x="96" y="188" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="800" fill="#FFFFFF" letter-spacing="0.5">
    PREM MANDAL
  </text>

  <!-- title -->
  <text x="96" y="228" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="url(#accent)">
    BUSINESS &amp; DATA ANALYST
  </text>

  <!-- subtitle -->
  <text x="96" y="262" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#B7BCCC">
    Power BI Developer · Microsoft Fabric · SQL · Python
  </text>

  <!-- tagline -->
  <text x="96" y="300" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-style="italic" fill="#7C8299">
    "I make boring data disappear and awesomeness appear."
  </text>

  <!-- contact row -->
  <g font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#9CA1B5">
    <text x="96" y="342">jobs.premmandal@gmail.com</text>
    <circle cx="330" cy="337" r="2.5" fill="#4A4F63"/>
    <text x="345" y="342">Kolkata, India</text>
    <circle cx="480" cy="337" r="2.5" fill="#4A4F63"/>
    <text x="495" y="342">linkedin.com/in/premmandal</text>
  </g>
</svg>
